<script>
'use strict';
/* =====================================================================
   ANAMIRA CAR RENTAL — Single-file ERP (Dubai)
   Storage: localStorage (default) + optional Supabase cloud sync
   ===================================================================== */
const APP_VERSION = '1.0.0';
const LS_DB = 'anamira_db_v1', LS_LANG = 'anamira_lang', LS_CFG = 'anamira_cfg', LS_Q = 'anamira_sync_queue', LS_USER = 'anamira_user';
const DUBAI_OFFSET_MIN = 240; // UAE is UTC+4 all year (no DST)
const SUPABASE_CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';

/* ---------------- Utilities ---------------- */
let lang = localStorage.getItem(LS_LANG) || 'en';
const X = (en, ar) => (lang === 'ar' ? (ar || en) : en);

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function uuid() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function num(v) { const n = parseFloat(v); return isFinite(n) ? n : 0; }
function r2(n) { return Math.round((num(n) + Number.EPSILON) * 100) / 100; }
function fmtN(n) { return num(n).toLocaleString('en-AE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function money(n) { return fmtN(n) + ' ' + X('AED', 'د.إ'); }
function dxLocal(iso) { if (!iso) return ''; const d = new Date(iso); if (isNaN(d)) return ''; return new Date(d.getTime() + DUBAI_OFFSET_MIN * 60000).toISOString().slice(0, 16); }
function dxISO(local) {
  if (!local) return '';
  if (/[zZ]$|[+-]\d\d:?\d\d$/.test(local)) { const d = new Date(local); return isNaN(d) ? '' : d.toISOString(); }
  const s = local.length === 10 ? local + 'T00:00' : local.slice(0, 16);
  const d = new Date(s + ':00+04:00'); return isNaN(d) ? '' : d.toISOString();
}
function today() { return dxLocal(new Date().toISOString()).slice(0, 10); }
function nowLocal() { return dxLocal(new Date().toISOString()); }
function thisMonth() { return today().slice(0, 7); }
function periodDate(month) { const [y, m] = month.split('-').map(Number); const last = `${month}-${String(new Date(Date.UTC(y, m, 0)).getUTCDate()).padStart(2, '0')}`; return last < today() ? last : today(); }
function fmtDT(iso) { const l = dxLocal(iso); return l ? l.replace('T', ' ') : ''; }
function fmtD(d) { return d ? String(d).slice(0, 10) : ''; }
function daysUntil(d) { if (!d) return null; const t = Date.parse(String(d).slice(0, 10) + 'T00:00:00+04:00'); const n = Date.parse(today() + 'T00:00:00+04:00'); return Math.round((t - n) / 864e5); }
function sum(arr, fn) { return r2(arr.reduce((a, x) => a + num(fn(x)), 0)); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function loadScript(src) { return new Promise((res, rej) => { if ($(`script[src="${src}"]`)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + src)); document.head.appendChild(s); }); }
function downloadFile(name, content, type = 'text/plain') { const b = new Blob([content], { type }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

function icons() { try { if (window.lucide) window.lucide.createIcons(); } catch (e) { /* ignore */ } }

/* ---------------- Roles / RBAC ---------------- */
const ROLES = {
  admin:      { l: ['Administrator', 'مسؤول النظام'], groups: '*' },
  manager:    { l: ['Manager', 'مدير'], groups: ['dash', 'setup', 'hr', 'fleet', 'rental', 'ops', 'finance', 'comms'] },

/* ---------------- Seed data ---------------- */
const VEH_IDS = Array.from({ length: 9 }, (_, i) => 'a0000000-0000-4000-8000-00000000000' + (i + 1));
const STAFF_IDS = Array.from({ length: 5 }, (_, i) => 'b0000000-0000-4000-8000-00000000000' + (i + 1));
const COLLECTIONS = ['branches', 'departments', 'designations', 'banks', 'currencies', 'services_catalog', 'residences', 'holidays', 'blacklist',
  'staff', 'duty', 'timecards', 'vacations', 'deductions', 'payroll',

function seed() {
  const now = new Date().toISOString();
  const db = { meta: { version: 1, seeded_at: now }, settings: {} };
  COLLECTIONS.forEach(c => db[c] = []);
  const mk = (o) => Object.assign({ id: uuid(), created_at: now, updated_at: now }, o);

    .map(([code, name, name_ar]) => mk({ code, name, name_ar }));
  db.departments.push(...deps);
  const dep = code => deps.find(d => d.code === code).id;
  [['Agent', 'وكيل تأجير'], ['PRO', 'مندوب علاقات حكومية'], ['Manager', 'مدير'], ['Asst. Manager', 'مساعد مدير'], ['Accountant', 'محاسب']]
    .forEach(([name, name_ar]) => db.designations.push(mk({ name, name_ar })));
  [['AED', 'UAE Dirham', 'درهم إماراتي', 1], ['USD', 'US Dollar', 'دولار أمريكي', 3.6725], ['EUR', 'Euro', 'يورو', 4.0], ['SAR', 'Saudi Riyal', 'ريال سعودي', 0.979]]
    .forEach(([code, name, name_ar, rate]) => db.currencies.push(mk({ code, name, name_ar, rate })));
  [['Rental — Daily', 'إيجار يومي'], ['Rental — Weekly', 'إيجار أسبوعي'], ['Rental — Monthly', 'إيجار شهري'], ['Chauffeur', 'سائق خاص'], ['Delivery & Collection', 'توصيل واستلام'], ['Child Seat', 'مقعد أطفال'], ['Additional Driver', 'سائق إضافي'], ['Full Insurance (CDW)', 'تأمين شامل']]
    .forEach(([name, name_ar]) => db.services_catalog.push(mk({ name, name_ar, price: 0, taxable: true })));
  [['UAE Resident', 'مقيم في الإمارات'], ['GCC National', 'مواطن خليجي'], ['Tourist / Visit Visa', 'سائح / تأشيرة زيارة']]
    .forEach(([name, name_ar]) => db.residences.push(mk({ name, name_ar })));
  const S = [
    ['Hussein', 'حسين', 'Agent', 'وكيل تأجير', 'agent', 'OPS'],
    ['Essa', 'عيسى', 'PRO', 'مندوب علاقات حكومية', 'pro', 'GOV'],
    ['Faisal', 'فيصل', 'Manager', 'المدير', 'admin', 'ADM'],
    ['Fuad', 'فؤاد', 'Asst. Manager', 'مساعد المدير', 'manager', 'ADM'],
    ['Abu Saed', 'أبو سعيد', 'Accounting', 'المحاسبة', 'accountant', 'ACC']
  ];
  S.forEach(([name, name_ar, position, position_ar, role, d], i) => db.staff.push(mk({
    id: STAFF_IDS[i], emp_no: 'EMP-' + String(i + 1).padStart(3, '0'), name, name_ar, position, position_ar, role,
    department_id: dep(d), branch_id: br.id, phone: '', email: '', basic_salary: 0, allowances: 0, join_date: '', status: 'active', nationality: '', visa_expiry: '', emirates_id_expiry: ''
  })));
  const V = [
    ['G', '18703', 'Chevrolet', 'Corvette Stingray', 2023, 'sports', 1200],
    ['CC', '60743', 'Chevrolet', 'Camaro', 2023, 'sports', 600],
    ['B', '42894', 'GMC', 'Yukon', 2024, 'suv', 750],
    ['CC', '76781', 'Ford', 'Mustang', 2025, 'sports', 650],
    ['D', '87201', 'Nissan', 'Rogue', 2024, 'suv', 250],
    ['DD', '71278', 'Nissan', 'Sentra', 2024, 'sedan', 170],
    ['Q', '83931', 'Nissan', 'Sentra', 2025, 'sedan', 180],
    ['DD', '83795', 'Nissan', 'Sentra', 2023, 'sedan', 160],
    ['O', '45189', 'Mercedes-Benz', 'E 320', 2023, 'luxury', 550]
  ];
  V.forEach(([plate_code, plate_number, make, model, year, category, rate], i) => db.vehicles.push(mk({
    id: VEH_IDS[i], plate_code, plate_number, emirate: 'Dubai', make, model, year, category, color: '', chassis_no: '',
    daily_rate: rate, weekly_rate: rate * 6, monthly_rate: rate * 22, status: 'available', odometer: 0, branch_id: br.id,
    purchase_date: '', purchase_price: 0, insurance_expiry: '', registration_expiry: '', notes: ''
  })));
  const G = [['1', 'Assets', 'الأصول', 'asset'], ['2', 'Liabilities', 'الخصوم', 'liability'], ['3', 'Equity', 'حقوق الملكية', 'equity'], ['4', 'Revenue', 'الإيرادات', 'revenue'], ['5', 'Expenses', 'المصروفات', 'expense']]
    .map(([code, name, name_ar, type]) => mk({ code, name, name_ar, type }));
  db.account_groups.push(...G);
  const grp = type => G.find(g => g.type === type).id;
  [
    ['1100', 'Cash on Hand', 'النقدية بالصندوق', 'asset'], ['1110', 'Petty Cash', 'العهدة النقدية', 'asset'], ['1120', 'Bank Account', 'الحساب البنكي', 'asset'],
    ['1200', 'Accounts Receivable', 'الذمم المدينة', 'asset'], ['1250', 'VAT Recoverable (Input)', 'ضريبة مدخلات مستردة', 'asset'], ['1300', 'Inventory — Parts & Supplies', 'المخزون — قطع ومستلزمات', 'asset'],
    ['1500', 'Fleet Vehicles', 'مركبات الأسطول', 'asset'], ['1510', 'Accumulated Depreciation', 'مجمع الإهلاك', 'asset'], ['1600', 'Other Fixed Assets', 'أصول ثابتة أخرى', 'asset'],
    ['2100', 'Accounts Payable', 'الذمم الدائنة', 'liability'], ['2200', 'VAT Payable (Output)', 'ضريبة المخرجات المستحقة', 'liability'], ['2300', 'Customer Security Deposits', 'تأمينات العملاء', 'liability'],
    ['2400', 'Salaries Payable', 'رواتب مستحقة', 'liability'], ['2500', 'Traffic Fines Payable', 'مخالفات مرورية مستحقة', 'liability'],
    ['3100', 'Owner Capital', 'رأس المال', 'equity'], ['3200', 'Retained Earnings', 'الأرباح المحتجزة', 'equity'],
    ['4100', 'Rental Revenue', 'إيرادات التأجير', 'revenue'], ['4200', 'Salik Recharges', 'استرداد رسوم سالك', 'revenue'], ['4300', 'Admin Fees', 'رسوم إدارية', 'revenue'], ['4400', 'Sales Revenue', 'إيرادات المبيعات', 'revenue'], ['4900', 'Other Income', 'إيرادات أخرى', 'revenue'],

    ['5500', 'Insurance & Registration', 'التأمين والتسجيل', 'expense'], ['5600', 'Salik Tolls (Company)', 'رسوم سالك (الشركة)', 'expense'], ['5700', 'Traffic Fines (Company)', 'مخالفات مرورية (الشركة)', 'expense'],
    ['5800', 'Rent & Utilities', 'الإيجار والمرافق', 'expense'], ['5850', 'Cost of Goods Sold', 'تكلفة البضاعة المباعة', 'expense'], ['5900', 'General & Admin', 'مصروفات عمومية وإدارية', 'expense']
  ].forEach(([code, name, name_ar, type]) => db.accounts.push(mk({ code, name, name_ar, type, group_id: grp(type), active: true })));
  db.stores.push(mk({ code: 'ST-01', name: 'Main Store — Dubai', name_ar: 'المستودع الرئيسي — دبي', branch_id: br.id }));
  return db;
}

/* ---------------- Data store ---------------- */
let db;
const state = { view: 'dashboard', q: '', filters: {}, imp: null, user: localStorage.getItem(LS_USER) || STAFF_IDS[2] };
function loadDB() {
  try { const raw = localStorage.getItem(LS_DB); if (raw) { db = JSON.parse(raw); migrateDB(); return; } } catch (e) { console.warn('DB load failed', e); }
  db = seed(); persist();
}
function migrateDB() {
  const s = seed();
  Object.keys(s).forEach(k => { if (db[k] === undefined) db[k] = s[k]; });
  db.settings = Object.assign({}, s.settings, db.settings || {});
  if (!db.settings.dep_runs) db.settings.dep_runs = {};
}
function persist() {
  try { localStorage.setItem(LS_DB, JSON.stringify(db)); }
  catch (e) { UI.toast(X('Browser storage is full — export a backup and remove large attachments.', 'ذاكرة المتصفح ممتلئة — صدّر نسخة احتياطية واحذف المرفقات الكبيرة.'), 'err'); }
}
const Store = {
  all(c) { return db[c] || []; },
  get(c, id) { return (db[c] || []).find(r => r.id === id); },
  upsert(c, rec, opt = {}) {
    if (!db[c]) db[c] = [];
    const ts = new Date().toISOString();
    rec.updated_at = ts;
    if (!rec.id) rec.id = uuid();
    const i = db[c].findIndex(r => r.id === rec.id);
    if (i >= 0) db[c][i] = rec; else { rec.created_at = rec.created_at || ts; db[c].push(rec); }
    if (!opt.remote) { persist(); Cloud.push(c, rec); if (c !== 'audit' && c !== 'chat') logAudit(i >= 0 ? 'update' : 'create', c, rec); }
    return rec;
  },
  remove(c, id, opt = {}) {
    const old = this.get(c, id);
    db[c] = (db[c] || []).filter(r => r.id !== id);
    if (!opt.remote) { persist(); Cloud.del(c, id); if (old) logAudit('delete', c, old); }
  }
};
function logAudit(action, col, rec) {
  db.audit.unshift({ id: uuid(), at: new Date().toISOString(), user: currentUser()?.name || '-', action, col, ref: labelOf(col, rec) });
  if (db.audit.length > 500) db.audit.length = 500;
  persist();
}
function currentUser() { return Store.get('staff', state.user) || db.staff[0]; }
function currentRole() { return Cloud.role || currentUser()?.role || 'agent'; }
function canGroup(g) { const r = ROLES[currentRole()] || ROLES.agent; return r.groups === '*' || r.groups.includes(g); }
function nextNo(col, field, prefix) {
  const y = today().slice(0, 4), p = `${prefix}-${y}-`;
  const max = Store.all(col).reduce((m, r) => { const v = String(r[field] || ''); return v.startsWith(p) ? Math.max(m, parseInt(v.slice(p.length), 10) || 0) : m; }, 0);
  return p + String(max + 1).padStart(4, '0');
}

/* ---------------- Labels / lookups ---------------- */
function nm(r) { if (!r) return ''; return (lang === 'ar' && r.name_ar) ? r.name_ar : (r.name || r.title || r.code || ''); }
function plateOf(v) { return v ? `${v.plate_code} ${v.plate_number}` : ''; }
function labelOf(col, r) {
  if (!r) return '';
  switch (col) {
    case 'vehicles': return `${r.make} ${r.model} ${r.year} · ${plateOf(r)}`;
    case 'accounts': return `${r.code} · ${nm(r)}`;
    case 'contracts': return `${r.contract_no} · ${nm(Store.get('customers', r.customer_id))}`;
    case 'invoices': return `${r.invoice_no} · ${money(r.total)}`;
    case 'items': return `${r.sku || ''} ${nm(r)}`.trim();
    case 'vouchers': return r.voucher_no;
    case 'breaches': return `${r.reference_no || ''} ${r.plate_code || ''} ${r.plate_number || ''}`;
    default: return nm(r) || r.contract_no || r.invoice_no || r.receipt_no || r.reference_no || r.id;
  }
}
function refLabel(col, id) { return id ? labelOf(col, Store.get(col, id)) : ''; }
function acc(code) { const a = db.accounts.find(x => x.code === code); return a ? a.id : ''; }

/* ---------------- Accounting engine ---------------- */
function postVoucher({ type = 'JV', date, narration = '', reference = '', source = '', lines }) {
  const ls = lines.filter(l => l.account_id && (num(l.debit) || num(l.credit))).map(l => ({ account_id: l.account_id, debit: r2(l.debit), credit: r2(l.credit), memo: l.memo || '' }));
  const d = sum(ls, l => l.debit), c = sum(ls, l => l.credit);
  if (!ls.length) return null;
  if (Math.abs(d - c) > 0.01) throw new Error(X('Voucher not balanced', 'القيد غير متوازن') + ` (${fmtN(d)} ≠ ${fmtN(c)})`);
  const prefix = { JV: 'JV', RV: 'RV', PV: 'PV' }[type] || 'JV';
  return Store.upsert('vouchers', { voucher_no: nextNo('vouchers', 'voucher_no', prefix), voucher_type: type, voucher_date: date || today(), reference, narration, lines: ls, total: d, status: 'posted', source });
}
function reverseVoucher(id) { if (id && Store.get('vouchers', id)) Store.remove('vouchers', id); }
function ledgerBalances(upTo) {
  const bal = {};
  Store.all('vouchers').filter(v => v.status === 'posted' && (!upTo || v.voucher_date <= upTo)).forEach(v => (v.lines || []).forEach(l => {
    const b = bal[l.account_id] || (bal[l.account_id] = { dr: 0, cr: 0 });
    b.dr += num(l.debit); b.cr += num(l.credit);
  }));
  return bal;
}
function cashAcc(method) { return method === 'cash' ? acc('1100') : acc('1120'); }

/* ---------------- Rental engine ---------------- */
function calcContract(c, overrides = {}) {
  const s = db.settings, x = Object.assign({}, c, overrides);
  const start = Date.parse(x.start_at), end = Date.parse(x.actual_return_at || x.end_at);
  let days = 1;
  if (isFinite(start) && isFinite(end) && end > start) {
    const hours = (end - start) / 36e5;
    const full = Math.floor(hours / 24), rem = hours - full * 24;
    days = Math.max(1, full + (rem > num(s.late_grace_hours) ? 1 : 0));
  }
  const rate = num(x.rate);
  const rent = x.rate_type === 'weekly' ? rate / 7 * days : x.rate_type === 'monthly' ? rate / 30 * days : rate * days;
  let extraKm = 0;
  if (num(x.km_in) > 0 && num(x.km_in) >= num(x.km_out)) {
    const allowed = num(s.km_per_day) * days, driven = num(x.km_in) - num(x.km_out);
    if (num(s.km_per_day) > 0 && driven > allowed) extraKm = (driven - allowed) * num(s.extra_km_rate);
  }
  const brs = Store.all('breaches').filter(b => b.contract_id === c.id && ['assigned_customer', 'invoiced', 'paid'].includes(b.billing_status));
  const salik = sum(brs.filter(b => b.breach_type === 'salik'), b => b.amount);
  const fines = sum(brs.filter(b => b.breach_type !== 'salik'), b => b.amount);
  const adminFees = sum(brs, b => b.admin_fee);
  const taxable = r2(rent + extraKm + num(x.extra_charges) + adminFees - num(x.discount));
  const vat = r2(taxable * num(x.vat_rate ?? s.vat_rate) / 100);
  const total = r2(taxable + vat + salik + fines);
  return { days, rent: r2(rent), extraKm: r2(extraKm), extras: r2(num(x.extra_charges)), discount: r2(num(x.discount)), salik, fines, adminFees, taxable, vat, total, breaches: brs };
}
function vehicleBusy(vehId, startISO, endISO, exceptId) {
  const s = Date.parse(startISO), e = Date.parse(endISO);
  return Store.all('contracts').some(c => c.id !== exceptId && c.vehicle_id === vehId && c.status === 'open' && Date.parse(c.start_at) < e && Math.max(Date.parse(c.end_at), Date.now()) > s);
}
function checkBlacklist(cust) {
  if (!cust) return null;
  const norm = v => String(v || '').replace(/\W/g, '').toUpperCase();
  return Store.all('blacklist').find(b => b.list_type !== 'white' && ((b.id_no && norm(b.id_no) === norm(cust.id_no)) || (b.phone && norm(b.phone) === norm(cust.phone)) || (b.customer_id && b.customer_id === cust.id)));
}

/* ---------------- Inventory / assets helpers ---------------- */
function stockOf(itemId, storeId, excludeTransferId) {
  return r2(Store.all('stock_tx').filter(t => t.item_id === itemId && (!storeId || t.store_id === storeId) && (!excludeTransferId || t.transfer_id !== excludeTransferId))
    .reduce((a, t) => a + (t.tx_type === 'out' ? -num(t.qty) : num(t.qty)), 0));
}
function depMonthly(a) { const life = num(a.life_years) * 12; return life > 0 ? r2((num(a.cost) - num(a.salvage)) / life) : 0; }
function customerBalance(cid) {
  const inv = Store.all('invoices').filter(i => i.customer_id === cid && i.status !== 'void');
  return r2(sum(inv, i => i.total) - sum(inv, i => i.paid));
}

/* ---------------- Business hooks (auto-posting) ---------------- */
const Hooks = {
  vehicle(v, isNew) {
    if (num(v.purchase_price) > 0 && !Store.all('assets').some(a => a.vehicle_id === v.id)) {
      const a = Store.upsert('assets', { name: `${v.make} ${v.model} ${v.year} (${plateOf(v)})`, name_ar: '', category: 'vehicle', vehicle_id: v.id, purchase_date: v.purchase_date || today(), cost: num(v.purchase_price), salvage: num(v.salvage), life_years: num(v.life_years) || 5, method: 'straight_line', dep_posted: 0 });
      const credit = v.pay_from === 'cash' ? acc('1100') : v.pay_from === 'bank' ? acc('1120') : acc('2100');
      try { postVoucher({ type: v.pay_from === 'payable' || !v.pay_from ? 'JV' : 'PV', date: a.purchase_date, narration: `Vehicle purchase ${plateOf(v)}`, reference: plateOf(v), source: 'vehicle:' + v.id, lines: [{ account_id: acc('1500'), debit: a.cost }, { account_id: credit, credit: a.cost }] }); } catch (e) { UI.toast(e.message, 'err'); }
      UI.toast(X('Fixed asset created and purchase voucher posted.', 'تم إنشاء الأصل الثابت وترحيل قيد الشراء.'));
    }
  },
  transfer(t) {
    Store.all('stock_tx').filter(x => x.transfer_id === t.id).forEach(x => Store.remove('stock_tx', x.id));
    const cost = num(Store.get('items', t.item_id)?.cost);
    Store.upsert('stock_tx', { date: t.date, tx_type: 'out', store_id: t.from_store, item_id: t.item_id, qty: num(t.qty), unit_cost: cost, reference: 'Transfer', transfer_id: t.id });
    Store.upsert('stock_tx', { date: t.date, tx_type: 'in', store_id: t.to_store, item_id: t.item_id, qty: num(t.qty), unit_cost: cost, reference: 'Transfer', transfer_id: t.id });
  },
  transferDelete(t) { Store.all('stock_tx').filter(x => x.transfer_id === t.id).forEach(x => Store.remove('stock_tx', x.id)); },
  maintenance(m) {
    const v = Store.get('vehicles', m.vehicle_id);
    if (v && v.status !== 'rented' && v.status !== 'sold') {
      const ns = m.status === 'in_progress' ? 'maintenance' : (m.status === 'completed' && v.status === 'maintenance' ? 'available' : v.status);
      let changed = ns !== v.status;
      if (num(m.odometer) > num(v.odometer)) { v.odometer = num(m.odometer); changed = true; }
      if (changed) { v.status = ns; Store.upsert('vehicles', v); }
    }
    reverseVoucher(m.voucher_id); m.voucher_id = '';
    if (m.status === 'completed' && num(m.cost) > 0) {
      const credit = m.pay_from === 'bank' ? acc('1120') : m.pay_from === 'payable' ? acc('2100') : acc('1100');
      const vt = r2(num(m.cost) + num(m.vat));
      const vch = postVoucher({ type: m.pay_from === 'payable' ? 'JV' : 'PV', date: m.date, narration: `Maintenance ${plateOf(v)} — ${m.workshop || ''}`, reference: plateOf(v), source: 'maintenance:' + m.id,
        lines: [{ account_id: acc('5200'), debit: m.cost }, { account_id: acc('1250'), debit: m.vat }, { account_id: credit, credit: vt }] });
      m.voucher_id = vch ? vch.id : '';
    }
    Store.upsert('maintenance', m);
  },
  expense(e) {
    reverseVoucher(e.voucher_id);
    const credit = e.pay_from === 'bank' ? acc('1120') : e.pay_from === 'payable' ? acc('2100') : acc('1100');
    const vch = postVoucher({ type: e.pay_from === 'payable' ? 'JV' : 'PV', date: e.date, narration: e.description || 'Expense', reference: e.supplier || '', source: 'expense:' + e.id,
      lines: [{ account_id: e.account_id, debit: e.amount }, { account_id: acc('1250'), debit: e.vat }, { account_id: credit, credit: r2(num(e.amount) + num(e.vat)) }] });
    e.voucher_id = vch ? vch.id : ''; Store.upsert('expenses', e);
  },
  receipt(r, old) {
    if (old) Hooks.receiptUndo(old);
    reverseVoucher(r.voucher_id);
    const inv = Store.get('invoices', r.invoice_id), con = Store.get('contracts', r.contract_id);
    let creditAcc = acc('1200');
    if (inv) { inv.paid = r2(num(inv.paid) + num(r.amount)); inv.status = num(inv.paid) >= num(inv.total) - 0.009 ? 'paid' : 'partial'; Store.upsert('invoices', inv); }
    else if (con) { con.paid = r2(num(con.paid) + num(r.amount)); Store.upsert('contracts', con); creditAcc = acc('2300'); }
    const vch = postVoucher({ type: 'RV', date: r.date, narration: `Receipt ${r.receipt_no} — ${refLabel('customers', r.customer_id)}`, reference: r.receipt_no, source: 'receipt:' + r.id,
      lines: [{ account_id: cashAcc(r.method), debit: r.amount }, { account_id: creditAcc, credit: r.amount }] });
    r.voucher_id = vch ? vch.id : ''; Store.upsert('receipts', r);
  },
  receiptUndo(r) {
    const inv = Store.get('invoices', r.invoice_id), con = Store.get('contracts', r.contract_id);
    if (inv) { inv.paid = r2(num(inv.paid) - num(r.amount)); inv.status = num(inv.paid) >= num(inv.total) - 0.009 ? 'paid' : (num(inv.paid) > 0 ? 'partial' : 'unpaid'); Store.upsert('invoices', inv); }
    else if (con) { con.paid = r2(num(con.paid) - num(r.amount)); Store.upsert('contracts', con); }
  },
  receiptDelete(r) { Hooks.receiptUndo(r); reverseVoucher(r.voucher_id); }
};

/* ---------------- UI core ---------------- */
const UI = {
  toast(msg, kind = 'ok') {
    const c = { ok: 'bg-emerald-600', err: 'bg-rose-600', warn: 'bg-amber-500', info: 'bg-slate-800' }[kind] || 'bg-slate-800';
    const el = document.createElement('div');
    el.className = `${c} text-white text-sm px-4 py-2.5 rounded-xl shadow-lg fade-in max-w-sm`;
    el.textContent = msg; $('#toast-root').appendChild(el);
    setTimeout(() => el.remove(), 4200);
  },
  modal(title, body, opt = {}) {
    const root = $('#modal-root');
    root.innerHTML = `<div class="fixed inset-0 z-50 bg-slate-900/40 flex items-start justify-center p-3 sm:p-6 overflow-y-auto" id="modal-bg">
      <div class="bg-white rounded-2xl shadow-2xl w-full ${opt.wide ? 'max-w-5xl' : 'max-w-2xl'} fade-in my-4">
        <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100"><h3 class="font-semibold text-lg">${title}</h3>
        <button class="p-1.5 rounded-lg hover:bg-slate-100" onclick="UI.close()" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button></div>
        <div class="p-5" id="modal-body">${body}</div></div></div>`;
    $('#modal-bg').addEventListener('mousedown', e => { if (e.target.id === 'modal-bg') UI.close(); });
    icons(); if (opt.onOpen) opt.onOpen($('#modal-body'));
    const f = $('#modal-body input:not([type=hidden]):not([readonly]), #modal-body select'); if (f && !opt.noFocus) f.focus();
  },

const HR = {
  clock(kind) {
    const u = currentUser(); let t = Store.all('timecards').find(c => c.staff_id === u.id && c.date === today());
    if (kind === 'in' && !t) Store.upsert('timecards', { staff_id: u.id, date: today(), clock_in: new Date().toISOString(), clock_out: '' });
    if (kind === 'out' && t) { t.clock_out = new Date().toISOString(); Store.upsert('timecards', t); }
    render();
  },
  build(month) {
    return Store.all('staff').filter(s => s.status !== 'inactive').map(s => {
      const ded = sum(Store.all('deductions').filter(d => d.staff_id === s.id && d.month === month), d => d.amount);
      const gross = r2(num(s.basic_salary) + num(s.allowances));
      return { staff_id: s.id, name: nm(s), basic: num(s.basic_salary), allowances: num(s.allowances), deductions: ded, net: r2(gross - ded) };
    });
  },
  post(month) {
    if (Store.all('payroll').some(p => p.month === month)) return UI.toast(X('Payroll already posted for this month', 'تم ترحيل رواتب هذا الشهر مسبقاً'), 'err');
    const lines = HR.build(month), net = sum(lines, l => l.net);
    if (net <= 0) return UI.toast(X('Set basic salaries on Employees first.', 'حدد الرواتب الأساسية في شاشة الموظفين أولاً.'), 'warn');
    const v = postVoucher({ type: 'JV', date: periodDate(month), narration: `Payroll ${month}`, reference: 'PAY-' + month, source: 'payroll', lines: [{ account_id: acc('5100'), debit: net }, { account_id: acc('2400'), credit: net }] });
    Store.upsert('payroll', { month, lines, total: net, status: 'posted', voucher_id: v?.id || '', paid_voucher_id: '' }); render(); UI.toast(X('Payroll posted', 'تم ترحيل الرواتب'));
  },
  pay(id) {
    const p = Store.get('payroll', id); if (!p || p.status === 'paid') return;
    const v = postVoucher({ type: 'PV', date: today(), narration: `Salaries paid ${p.month}`, reference: 'PAY-' + p.month, source: 'payroll', lines: [{ account_id: acc('2400'), debit: p.total }, { account_id: acc('1120'), credit: p.total }] });
    p.status = 'paid'; p.paid_voucher_id = v?.id || ''; Store.upsert('payroll', p); render();
  },
  remove(id) { const p = Store.get('payroll', id); if (!p || !UI.confirm(X('Delete this payroll run and its vouchers?', 'حذف مسير الرواتب وقيوده؟'))) return; reverseVoucher(p.voucher_id); reverseVoucher(p.paid_voucher_id); Store.remove('payroll', id); render(); }
};

/* ---------------- Assets ---------------- */
const AS = {
  runDep() {
    const month = $('#dep-month').value; if (!month) return;
    if (db.settings.dep_runs[month]) return UI.toast(X('Depreciation already posted for', 'تم ترحيل الإهلاك مسبقاً لشهر') + ' ' + month, 'err');
    let total = 0;
    Store.all('assets').forEach(a => {
      if (!a.purchase_date || a.purchase_date.slice(0, 7) > month) return;
      const remaining = r2(num(a.cost) - num(a.salvage) - num(a.dep_posted));
      const amt = Math.min(depMonthly(a), remaining);
      if (amt > 0) { a.dep_posted = r2(num(a.dep_posted) + amt); Store.upsert('assets', a); total += amt; }
    });
    total = r2(total);
    if (!total) return UI.toast(X('Nothing to depreciate for this month', 'لا يوجد إهلاك لهذا الشهر'), 'warn');
    const v = postVoucher({ type: 'JV', date: periodDate(month), narration: `Depreciation ${month}`, reference: 'DEP-' + month, source: 'depreciation', lines: [{ account_id: acc('5400'), debit: total }, { account_id: acc('1510'), credit: total }] });
    db.settings.dep_runs[month] = v?.id || true; Settings.save(); render(); UI.toast(`${X('Depreciation posted', 'تم ترحيل الإهلاك')}: ${money(total)}`);
  }
};

          }
          UI.close(); go('contracts'); UI.toast(X('Contract saved', 'تم حفظ العقد') + ' ' + saved.contract_no);
          if (!old && UI.confirm(X('Print the contract now?', 'طباعة العقد الآن؟'))) P.contract(saved.id);

    const body = `<form id="ret-form" class="grid sm:grid-cols-2 gap-4">
      <div class="sm:col-span-2 text-sm text-slate-600">${esc(c.contract_no)} · ${esc(refLabel('customers', c.customer_id))} · ${esc(labelOf('vehicles', v))}</div>
      <div><label class="lbl">${X('Actual return', 'وقت الإرجاع الفعلي')}</label><input type="datetime-local" name="actual_return_at" class="inp" value="${nowLocal()}" required></div>
      <div><label class="lbl">${X('Odometer in (km)', 'العداد عند الإرجاع')}</label><input type="number" name="km_in" class="inp" value="${esc(c.km_out || 0)}" min="${esc(c.km_out || 0)}"></div>

      <div><label class="lbl">${X('Extra charges (fuel, damage, cleaning…)', 'رسوم إضافية (وقود، أضرار، تنظيف…)')}</label><input type="number" step="0.01" name="extra_charges" class="inp" value="${esc(c.extra_charges || 0)}"></div>
      <div><label class="lbl">${X('Discount', 'الخصم')}</label><input type="number" step="0.01" name="discount" class="inp" value="${esc(c.discount || 0)}"></div>
      <div><label class="lbl">${X('Damage / return notes', 'ملاحظات الأضرار')}</label><input name="return_notes" class="inp"></div>
      <div class="sm:col-span-2 rounded-xl bg-slate-50 p-4 text-sm" id="ret-calc"></div>
      <div class="sm:col-span-2 flex justify-end gap-2"><button type="button" class="btn btn-light" onclick="UI.close()">${X('Cancel', 'إلغاء')}</button><button class="btn btn-success"><i data-lucide="check" class="w-4 h-4"></i>${X('Close contract & invoice', 'إغلاق العقد وإصدار الفاتورة')}</button></div></form>`;
    UI.modal(X('Return vehicle', 'إرجاع المركبة'), body, {

        const read = () => ({ actual_return_at: dxISO(f.elements.actual_return_at.value), km_in: num(f.elements.km_in.value), fuel_in: f.elements.fuel_in.value, extra_charges: num(f.elements.extra_charges.value), discount: num(f.elements.discount.value), return_notes: f.elements.return_notes.value });
        const upd = () => { const k = calcContract(c, read()); const dep = num(c.deposit), adv = num(c.paid);
          $('#ret-calc').innerHTML = `<table class="w-full"><tbody>
          <tr><td>${X('Rental', 'الإيجار')} (${k.days} ${X('days', 'أيام')})</td><td class="text-end">${fmtN(k.rent)}</td></tr>
          ${k.extraKm ? `<tr><td>${X('Extra km', 'كيلومترات إضافية')}</td><td class="text-end">${fmtN(k.extraKm)}</td></tr>` : ''}
          <tr><td>${X('Extra charges', 'رسوم إضافية')}</td><td class="text-end">${fmtN(k.extras)}</td></tr>
          ${k.adminFees ? `<tr><td>${X('Admin fees (fines/Salik)', 'رسوم إدارية')}</td><td class="text-end">${fmtN(k.adminFees)}</td></tr>` : ''}
          <tr><td>${X('Discount', 'الخصم')}</td><td class="text-end">-${fmtN(k.discount)}</td></tr>
          <tr><td>${X('VAT', 'الضريبة')}</td><td class="text-end">${fmtN(k.vat)}</td></tr>
          <tr><td>${X('Salik (pass-through)', 'سالك')} · ${k.breaches.filter(b => b.breach_type === 'salik').length}</td><td class="text-end">${fmtN(k.salik)}</td></tr>

          <tr class="font-bold text-brand-700"><td>${X('Balance due / (refund)', 'المستحق / (المسترد)')}</td><td class="text-end">${fmtN(k.total - adv - dep)}</td></tr></tbody></table>`; };

  close(id, ret) {
    const c = Store.get('contracts', id), v = Store.get('vehicles', c.vehicle_id);
    if (Date.parse(ret.actual_return_at) < Date.parse(c.start_at)) throw new Error(X('Return time is before pick-up', 'وقت الإرجاع قبل الاستلام'));
    Object.assign(c, ret);
    const k = calcContract(c), cn = c.contract_no;
    const lines = [{ desc: `${X('Car rental', 'تأجير سيارة')} ${labelOf('vehicles', v)} — ${k.days} ${X('day(s)', 'يوم')}`, qty: 1, price: k.rent, vat: true }];
    if (k.extraKm) lines.push({ desc: X('Extra kilometres', 'كيلومترات إضافية'), qty: 1, price: k.extraKm, vat: true });
    if (k.extras) lines.push({ desc: X('Additional services / charges', 'خدمات ورسوم إضافية'), qty: 1, price: k.extras, vat: true });
    if (k.discount) lines.push({ desc: X('Discount', 'خصم'), qty: 1, price: -k.discount, vat: true });
    k.breaches.forEach(b => { lines.push({ desc: `${b.breach_type === 'salik' ? 'Salik' : X('Traffic fine', 'مخالفة')} ${b.reference_no || ''} ${fmtDT(b.occurred_at)} ${b.location || ''}`.trim(), qty: 1, price: num(b.amount), vat: false }); if (num(b.admin_fee)) lines.push({ desc: X('Admin fee', 'رسوم إدارية') + ' ' + (b.reference_no || ''), qty: 1, price: num(b.admin_fee), vat: true }); });
    const depApplied = r2(Math.min(num(c.deposit), Math.max(0, k.total - num(c.paid))));
    const inv = Store.upsert('invoices', { invoice_no: nextNo('invoices', 'invoice_no', 'INV'), invoice_type: 'rental', date: today(), customer_id: c.customer_id, contract_id: c.id, lines, subtotal: k.taxable, vat: k.vat, total: k.total, paid: r2(num(c.paid) + depApplied), status: '' });
    inv.status = num(inv.paid) >= num(inv.total) - 0.009 ? 'paid' : (num(inv.paid) > 0 ? 'partial' : 'unpaid');
    const rentRev = r2(k.rent + k.extraKm + k.extras - k.discount);
    const vch = postVoucher({ type: 'JV', date: today(), narration: `Rental invoice ${inv.invoice_no} / ${cn}`, reference: inv.invoice_no, source: 'invoice:' + inv.id, lines: [
      { account_id: acc('1200'), debit: k.total }, { account_id: acc('4100'), credit: rentRev }, { account_id: acc('4300'), credit: k.adminFees }, { account_id: acc('4200'), credit: k.salik },
      { account_id: acc('2500'), credit: k.fines }, { account_id: acc('2200'), credit: k.vat }] });
    inv.voucher_id = vch?.id || '';
    // advance payments were held in deposits liability (2300) — apply them to the invoice
    const adv = r2(num(c.paid));
    if (adv > 0) postVoucher({ type: 'JV', date: today(), narration: `Apply advance payments ${cn}`, reference: inv.invoice_no, source: 'invoice:' + inv.id, lines: [{ account_id: acc('2300'), debit: adv }, { account_id: acc('1200'), credit: adv }] });
    if (depApplied > 0) postVoucher({ type: 'JV', date: today(), narration: `Apply security deposit ${cn}`, reference: inv.invoice_no, source: 'invoice:' + inv.id, lines: [{ account_id: acc('2300'), debit: depApplied }, { account_id: acc('1200'), credit: depApplied }] });
    const refund = r2(num(c.deposit) - depApplied);
    if (refund > 0) postVoucher({ type: 'PV', date: today(), narration: `Deposit refund ${cn}`, reference: cn, source: 'contract:' + c.id, lines: [{ account_id: acc('2300'), debit: refund }, { account_id: cashAcc(c.deposit_method), credit: refund }] });
    Store.upsert('invoices', inv);
    k.breaches.filter(b => b.billing_status === 'assigned_customer').forEach(b => { b.billing_status = 'invoiced'; b.invoice_id = inv.id; Store.upsert('breaches', b); });
    Object.assign(c, { status: 'closed', days: k.days, subtotal: k.taxable, vat: k.vat, total: k.total, invoice_id: inv.id, deposit_applied: depApplied, deposit_refund: refund });
    Store.upsert('contracts', c);
    if (v) { v.status = 'available'; if (num(ret.km_in) > num(v.odometer)) v.odometer = num(ret.km_in); Store.upsert('vehicles', v); }
    UI.toast(`${X('Contract closed — invoice', 'تم إغلاق العقد — فاتورة')} ${inv.invoice_no}`);
    if (UI.confirm(X('Print the tax invoice now?', 'طباعة الفاتورة الضريبية الآن؟'))) P.invoice(inv.id);
    return inv;
  }
};

      ${d.party === 'customer' ? `<div><label class="lbl">${X('Customer', 'العميل')}${kind === 'sales' ? '' : ' *'}</label><select name="customer_id" class="inp" ${kind === 'sales' ? '' : 'required'}><option value=""></option>${Store.all('customers').map(c => `<option value="${c.id}" ${c.id === r.customer_id ? 'selected' : ''}>${esc(nm(c))}</option>`).join('')}</select></div>`

      ${['purchases', 'sales', 'invoices'].includes(kind) ? `<div><label class="lbl">${X('Store (stock movement)', 'المستودع')}</label><select name="store_id" class="inp"><option value=""></option>${Store.all('stores').map(s => `<option value="${s.id}" ${s.id === r.store_id ? 'selected' : ''}>${esc(nm(s))}</option>`).join('')}</select></div>` : '<div></div>'}
      ${kind === 'purchases' || kind === 'sales' ? `<div><label class="lbl">${X('Payment', 'الدفع')}</label><select name="method" class="inp">${(kind === 'purchases' ? O(['payable', 'On credit (A/P)', 'آجل'], ['cash', 'Cash', 'نقداً'], ['bank', 'Bank', 'البنك']) : OPT.pay).map(o => `<option value="${o.v}" ${o.v === r.method ? 'selected' : ''}>${esc(L(o.l))}</option>`).join('')}</select></div>` : ''}
      <div class="sm:col-span-2"><label class="lbl">${X('Notes / terms', 'ملاحظات / شروط')}</label><input name="notes" class="inp" value="${esc(r.notes || '')}"></div></div>
      <div class="overflow-x-auto"><table class="tbl" id="doc-lines"><thead><tr><th>${X('Item', 'الصنف')}</th><th>${X('Description', 'الوصف')}</th><th>${X('Qty', 'الكمية')}</th><th>${X('Price', 'السعر')}</th><th>${X('VAT', 'ضريبة')}</th><th class="text-end">${X('Amount', 'المبلغ')}</th><th></th></tr></thead><tbody>${r.lines.map(lineRow).join('')}</tbody></table></div>
      <div class="flex justify-between items-start"><button type="button" class="btn btn-light btn-sm" id="doc-add"><i data-lucide="plus" class="w-4 h-4"></i>${X('Add line', 'إضافة سطر')}</button><div id="doc-tot" class="text-sm text-end"></div></div>
      <div class="flex justify-end gap-2 border-t pt-3"><button type="button" class="btn btn-light" onclick="UI.close()">${X('Cancel', 'إلغاء')}</button><button class="btn btn-primary"><i data-lucide="save" class="w-4 h-4"></i>${X('Save', 'حفظ')}</button></div></form>`;
    UI.modal(`${esc(L(d.l))} ${old ? esc(old[d.no]) : ''}`, body, {
      wide: true, onOpen: () => {
        const tb = $('#doc-lines tbody');
        const readLines = () => $$('tr', tb).map(tr => ({ item_id: $('[data-k=item_id]', tr).value, desc: $('[data-k=desc]', tr).value, qty: num($('[data-k=qty]', tr).value), price: num($('[data-k=price]', tr).value), vat: $('[data-k=vat]', tr).checked }));
        const upd = () => { const ls = readLines(); $$('tr', tb).forEach((tr, i) => $('[data-amt]', tr).textContent = fmtN(ls[i].qty * ls[i].price)); const t = DOC.totals(ls); $('#doc-tot').innerHTML = `${X('Subtotal', 'المجموع')}: <b>${fmtN(t.subtotal)}</b><br>${X('VAT', 'الضريبة')} ${db.settings.vat_rate}%: <b>${fmtN(t.vat)}</b><br>${X('Total', 'الإجمالي')}: <b class="text-brand-700 text-base">${money(t.total)}</b>`; };
        const bind = () => { $$('[data-del]', tb).forEach(b => b.onclick = () => { if ($$('tr', tb).length > 1) { b.closest('tr').remove(); upd(); } }); $$('[data-k=item_id]', tb).forEach(s => s.onchange = () => { const it = Store.get('items', s.value), tr = s.closest('tr'); if (it) { $('[data-k=desc]', tr).value = nm(it); $('[data-k=price]', tr).value = d.party === 'supplier' ? num(it.cost) : num(it.price); } upd(); }); };

          e.preventDefault(); const fe = e.target.elements;
          const ls = readLines().filter(l => l.desc || l.item_id); if (!ls.length) return UI.toast(X('Add at least one line', 'أضف سطراً واحداً على الأقل'), 'err');
          const t = DOC.totals(ls);
          Object.assign(r, { date: fe.date.value, lines: ls, subtotal: t.subtotal, vat: t.vat, total: t.total, notes: fe.notes.value, store_id: fe.store_id ? fe.store_id.value : '', method: fe.method ? fe.method.value : r.method });
          if (fe.customer_id) r.customer_id = fe.customer_id.value; if (fe.party_name) r.party_name = fe.party_name.value.trim();
          try { DOC.save(kind, r, old); UI.close(); render(); UI.toast(X('Saved', 'تم الحفظ')); } catch (ex) { console.error(ex); UI.toast(ex.message, 'err'); }
        };
      }
    });
  },
  totals(ls) { const subtotal = r2(ls.reduce((a, l) => a + l.qty * l.price, 0)); const vat = r2(ls.filter(l => l.vat).reduce((a, l) => a + l.qty * l.price, 0) * num(db.settings.vat_rate) / 100); return { subtotal, vat, total: r2(subtotal + vat) }; },
  undoEffects(r) { reverseVoucher(r.voucher_id); reverseVoucher(r.pay_voucher_id); Store.all('stock_tx').filter(t => t.doc_id === r.id).forEach(t => Store.remove('stock_tx', t.id)); },
  save(kind, r, old) {
    const d = DOCS[kind];
    if (!r[d.no]) r[d.no] = nextNo(d.col, d.no, d.prefix);
    if (kind === 'sales') r.invoice_type = 'pos'; else if (kind === 'invoices' && !r.invoice_type) r.invoice_type = 'sales';
    if (old) DOC.undoEffects(old);
    if (!d.post) { r.status = r.status || (kind === 'lpo' ? 'open' : 'pending'); Store.upsert(d.col, r); return; }
    r.paid = kind === 'sales' ? r.total : num(r.paid);
    r.status = kind === 'purchases' ? (r.method === 'payable' ? 'unpaid' : 'paid') : (num(r.paid) >= r.total - 0.009 ? 'paid' : (num(r.paid) > 0 ? 'partial' : 'unpaid'));

      saved.voucher_id = v?.id || '';
      if (r.store_id) r.lines.filter(l => l.item_id).forEach(l => Store.upsert('stock_tx', { date: r.date, tx_type: 'in', store_id: r.store_id, item_id: l.item_id, qty: l.qty, unit_cost: l.price, reference: r.purchase_no, doc_id: r.id }));
    } else {
      const v = postVoucher({ type: 'JV', date: r.date, narration: `${kind === 'sales' ? 'Cash sale' : 'Sales invoice'} ${r.invoice_no}`, reference: r.invoice_no, source: 'invoice:' + r.id,
        lines: [{ account_id: acc('1200'), debit: r.total }, { account_id: acc('4400'), credit: net }, { account_id: acc('2200'), credit: r.vat }] });
      saved.voucher_id = v?.id || '';
      if (kind === 'sales') { const pv = postVoucher({ type: 'RV', date: r.date, narration: `POS receipt ${r.invoice_no}`, reference: r.invoice_no, source: 'invoice:' + r.id, lines: [{ account_id: cashAcc(r.method), debit: r.total }, { account_id: acc('1200'), credit: r.total }] }); saved.pay_voucher_id = pv?.id || ''; }

        r.lines.filter(l => l.item_id).forEach(l => { const it = Store.get('items', l.item_id); cogs += l.qty * num(it?.cost); Store.upsert('stock_tx', { date: r.date, tx_type: 'out', store_id: r.store_id, item_id: l.item_id, qty: l.qty, unit_cost: num(it?.cost), reference: r.invoice_no, doc_id: r.id }); });
        cogs = r2(cogs); if (cogs > 0) { const cv = postVoucher({ type: 'JV', date: r.date, narration: `COGS ${r.invoice_no}`, reference: r.invoice_no, source: 'invoice:' + r.id, lines: [{ account_id: acc('5850'), debit: cogs }, { account_id: acc('1300'), credit: cogs }] }); saved.cogs_voucher_id = cv?.id || ''; }

  void(kind, id) {

  remove(kind, id) { const d = DOCS[kind]; if (!UI.confirm(X('Delete?', 'حذف؟'))) return; const r = Store.get(d.col, id); if (r) DOC.undoEffects(r); Store.remove(d.col, id); render(); },

V.aggregate = () => {
  const inv = Store.all('invoices').filter(i => i.status !== 'void');
  const rows = Store.all('vehicles').map(v => {
    const cs = Store.all('contracts').filter(c => c.vehicle_id === v.id && c.status !== 'cancelled');

    const br = Store.all('breaches').filter(b => b.vehicle_id === v.id);
    return { v, n: cs.length, days, rev, exp, net: r2(rev - exp), fines: br.filter(b => b.breach_type !== 'salik').length, salik: br.filter(b => b.breach_type === 'salik').length };

/* ---------------- SMS / Chat ---------------- */
const SMS_TPL = {
  return: ['Dear {name}, your Anamira rental {contract} is due back on {due}. Thank you.', 'عزيزي {name}، موعد إرجاع سيارة عقد {contract} من أناميرا هو {due}. شكراً لك.'],
  payment: ['Dear {name}, your outstanding balance with Anamira Car Rental is AED {balance}. Kindly arrange payment.', 'عزيزي {name}، رصيدك المستحق لدى أناميرا لتأجير السيارات هو {balance} درهم. يرجى السداد.'],
  fine: ['Dear {name}, a traffic fine / Salik charge was recorded during your rental. Amount: AED {amount}.', 'عزيزي {name}، تم تسجيل مخالفة / رسوم سالك خلال فترة التأجير. المبلغ: {amount} درهم.'],
  thanks: ['Thank you for choosing Anamira Car Rental, {name}! We hope to serve you again.', 'شكراً لاختيارك أناميرا لتأجير السيارات يا {name}! نتطلع لخدمتك مجدداً.']
};
const SMS = {
  intl(p) { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('00')) d = d.slice(2); if (d.startsWith('0')) d = '971' + d.slice(1); if (d.length === 9 && d.startsWith('5')) d = '971' + d; return d; },
  fill(tpl, cid) { const c = Store.get('customers', cid) || {}; const k = Store.all('contracts').find(x => x.customer_id === cid && x.status === 'open'); const br = Store.all('breaches').filter(b => b.customer_id === cid && b.billing_status === 'assigned_customer');
    return L(SMS_TPL[tpl] || ['', '']).replace('{name}', nm(c)).replace('{contract}', k?.contract_no || '').replace('{due}', k ? fmtDT(k.end_at) : '').replace('{balance}', fmtN(customerBalance(cid))).replace('{amount}', fmtN(sum(br, b => num(b.amount) + num(b.admin_fee)))); },
  compose(cid, tpl) { state.filters.smsCust = cid; state.filters.smsTpl = tpl || 'return'; go('sms'); },
  send(channel) {
    const to = $('#sms-to').value.trim(), msg = $('#sms-msg').value.trim(); if (!to || !msg) return UI.toast(X('Enter recipient and message', 'أدخل المستلم والرسالة'), 'err');
    const n = SMS.intl(to);
    Store.upsert('sms_log', { to: n, customer_id: state.filters.smsCust || '', message: msg, channel, status: channel === 'gateway' ? 'queued' : 'opened', sent_at: new Date().toISOString(), by: nm(currentUser()) });
    if (channel === 'whatsapp') window.open(`https://wa.me/${n}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
    else if (channel === 'sms') location.href = `sms:+${n}?body=${encodeURIComponent(msg)}`;
    else UI.toast(X('Queued. Connect an SMS gateway (e.g. Etisalat/du bulk SMS) via the serverless API to deliver automatically.', 'تمت الإضافة للطابور. اربط بوابة رسائل لإرسالها آلياً.'), 'info');
    render();
  }

/* ---------------- Breaches: reconciliation engine ---------------- */
const RECON = {
  parseCSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    text = String(text).replace(/^﻿/, '');
    const delim = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); if (row.some(c => c.trim() !== '')) rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
    row.push(cell); if (row.some(c => c.trim() !== '')) rows.push(row);
    return rows.map(r => r.map(c => c.trim()));
  },
  HDR: [
    ['ref', /(ticket|fine|violation|transaction|trip|trx|journey)\s*(no\.?|number|id|#)|^ref(erence)?(\s*no\.?)?$/i],
    ['datetime', /date\s*[&\/-]?\s*time|timestamp|crossing\s*time|date\s*of\s*(violation|crossing)/i],
    ['date', /date/i], ['time', /time/i],
    ['code', /plate\s*(code|category|cat\.?)|^code$/i],
    ['emirate', /plate\s*(source|emirate|state)|^emirate$|^source$/i],
    ['plate', /plate|vehicle\s*(no|number)|^vrn$|registration/i],
    ['points', /black\s*points?|^points$/i],
    ['amount', /amount|aed|fine\s*value|charge|fee|^value$|^fine$/i],
    ['gate', /gate|location|toll|place|area|street/i],
    ['desc', /description|violation\s*(type|desc)|offen[cs]e|direction|details/i]
  ],
  mapHeaders(h) { const m = {}; h.forEach((name, i) => { for (const [k, re] of RECON.HDR) { if (m[k] === undefined && re.test(name)) { m[k] = i; break; } } }); return m; },
  detectSource(h) { const s = h.join(' ').toLowerCase(); if (/gate|toll|salik|trip|direction/.test(s)) return 'salik'; if (/ticket|black|violation|fine/.test(s)) return 'dubai_police'; return 'dubai_police'; },
  parseDT(d, t) {
    d = String(d || '').trim(); t = String(t || '').trim();
    let y, mo, da, rest = '';
    const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
    let m;
    if ((m = d.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})[T\s]*(.*)$/))) { [, y, mo, da, rest] = m; }
    else if ((m = d.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\s*(.*)$/))) { [, da, mo, y, rest] = m; if (y.length === 2) y = '20' + y; }
    else if ((m = d.match(/^(\d{1,2})[-\s]([A-Za-z]{3})[A-Za-z]*[-\s,]+(\d{4})\s*(.*)$/))) { da = m[1]; mo = MON[m[2].toLowerCase()]; y = m[3]; rest = m[4]; }
    else { const p = Date.parse(d + (t ? ' ' + t : '')); return isNaN(p) ? '' : new Date(p).toISOString(); }
    const tm = (t || rest || '').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp][Mm])?/);
    let hh = tm ? +tm[1] : 0; const mi = tm ? +tm[2] : 0, ss = tm && tm[3] ? +tm[3] : 0;
    if (tm && tm[4]) { const pm = /p/i.test(tm[4]); if (pm && hh < 12) hh += 12; if (!pm && hh === 12) hh = 0; }
    const pad = n => String(n).padStart(2, '0');
    if (!(+mo >= 1 && +mo <= 12 && +da >= 1 && +da <= 31)) return '';
    const iso = `${y}-${pad(mo)}-${pad(da)}T${pad(hh)}:${pad(mi)}:${pad(ss)}+04:00`; // Dubai local time
    const dt = new Date(iso); return isNaN(dt) ? '' : dt.toISOString();
  },
  parsePlate(plateCell, codeCell) {
    let s = String(plateCell || '').toUpperCase().replace(/DUBAI|DXB|ABU\s*DHABI|AUH|SHARJAH|SHJ|AJMAN|AJM|RAS\s*AL\s*KHAIMAH|RAK|FUJAIRAH|FUJ|UMM\s*AL\s*QUWAIN|UAQ|PRIVATE|PVT|U\.?A\.?E\.?/g, ' ');
    const num = (s.match(/(\d{1,6})(?!.*\d)/) || [])[1] || '';
    let code = String(codeCell || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!code) { const before = num ? s.slice(0, s.lastIndexOf(num)) : s; const m = before.match(/([A-Z]{1,2})[^A-Z]*$/); code = m ? m[1] : ''; }
    return { plate_code: code, plate_number: num };
  },
  findVehicle(code, number) {
    const vs = Store.all('vehicles'), n = String(number).replace(/^0+/, '');
    const exact = vs.find(v => String(v.plate_number).replace(/^0+/, '') === n && String(v.plate_code).toUpperCase() === String(code).toUpperCase());
    if (exact) return exact;
    const byNum = vs.filter(v => String(v.plate_number).replace(/^0+/, '') === n);
    return !code && byNum.length === 1 ? byNum[0] : null;
  },
  findContract(vehId, iso) {
    const t = Date.parse(iso); if (!isFinite(t)) return null;
    return Store.all('contracts').filter(c => c.vehicle_id === vehId && c.status !== 'cancelled').filter(c => {
      const s = Date.parse(c.start_at); const e = c.actual_return_at ? Date.parse(c.actual_return_at) : (c.status === 'open' ? Math.max(Date.parse(c.end_at), Date.now()) : Date.parse(c.end_at));
      return t >= s && t <= e;
    }).sort((a, b) => Date.parse(b.start_at) - Date.parse(a.start_at))[0] || null;
  },
  adminFee(rec) { const s = db.settings; return rec.breach_type === 'salik' ? r2(num(s.salik_admin_fee)) : r2(num(rec.amount) * num(s.fine_admin_pct) / 100); },
  match(rec) {
    const v = RECON.findVehicle(rec.plate_code, rec.plate_number);
    const out = Object.assign({}, rec, { vehicle_id: v?.id || '', contract_id: '', customer_id: '', admin_fee: 0 });
    if (!v) out.billing_status = 'unmatched_plate';
    else { const c = RECON.findContract(v.id, rec.occurred_at); if (c) Object.assign(out, { contract_id: c.id, customer_id: c.customer_id, billing_status: 'assigned_customer', admin_fee: RECON.adminFee(rec) }); else out.billing_status = 'company_usage'; }
    out.matched_at = new Date().toISOString();
    const dup = Store.all('breaches').find(b => b.id !== rec.id && ((rec.reference_no && b.source === rec.source && b.reference_no === rec.reference_no) || (!rec.reference_no && b.plate_number === rec.plate_number && b.occurred_at === rec.occurred_at && num(b.amount) === num(rec.amount))));
    out._dup = !!dup;
    return out;
  },
  normalize(rows, source) {
    const h = rows[0], m = RECON.mapHeaders(h); source = source === 'auto' ? RECON.detectSource(h) : source;
    if (m.plate === undefined) throw new Error(X('Could not find a plate-number column in this CSV.', 'لم يتم العثور على عمود رقم اللوحة في الملف.') + ' ' + h.join(' | '));
    const get = (r, k) => m[k] === undefined ? '' : (r[m[k]] || '');
    return rows.slice(1).map((r, i) => {
      const p = RECON.parsePlate(get(r, 'plate'), get(r, 'code'));
      const iso = m.datetime !== undefined ? RECON.parseDT(get(r, 'datetime')) : RECON.parseDT(get(r, 'date'), get(r, 'time'));
      const type = source === 'salik' ? 'salik' : 'traffic_fine';
      let amount = num(String(get(r, 'amount')).replace(/[^\d.\-]/g, ''));
      if (!amount && type === 'salik') amount = num(db.settings.salik_default_fee);
      return { source, breach_type: type, reference_no: get(r, 'ref') || '', plate_code: p.plate_code, plate_number: p.plate_number, emirate: get(r, 'emirate') || 'Dubai', occurred_at: iso, location: get(r, 'gate'), description: get(r, 'desc'), amount: r2(amount), black_points: num(get(r, 'points')), _row: i + 2, _bad: !iso || !p.plate_number };
    });
  },
  preview(records) {
    const seen = new Set();
    state.imp = records.map(r => {
      if (r._bad) return Object.assign(r, { billing_status: 'invalid' });
      const m = RECON.match(r), key = r.reference_no ? r.source + '|' + r.reference_no : r.plate_number + '|' + r.occurred_at + '|' + r.amount;
      if (seen.has(key)) m._dup = true; seen.add(key); return m;
    });
    render();
  },
  async importFile(file, source) {
    try { const text = await file.text(); const rows = RECON.parseCSV(text); if (rows.length < 2) throw new Error(X('CSV is empty', 'الملف فارغ')); RECON.preview(RECON.normalize(rows, source)); }
    catch (e) { console.error(e); UI.toast(e.message, 'err'); }
  },
  commit() {
    const ok = (state.imp || []).filter(r => !r._bad && !r._dup);
    ok.forEach(r => { const { _row, _bad, _dup, ...rec } = r; rec.raw = { row: _row }; Store.upsert('breaches', rec); });
    UI.toast(`${ok.length} ${X('records imported', 'سجل تم استيراده')} · ${(state.imp || []).length - ok.length} ${X('skipped', 'تم تخطيه')}`);
    state.imp = null; render();
  },
  rematch() {
    let n = 0;
    Store.all('breaches').filter(b => ['unassigned', 'company_usage', 'unmatched_plate'].includes(b.billing_status)).forEach(b => {
      const m = RECON.match(b); delete m._dup;
      if (m.billing_status !== b.billing_status || m.contract_id !== b.contract_id) { Store.upsert('breaches', m); n++; }
    });
    UI.toast(`${n} ${X('records re-matched', 'سجل أعيدت مطابقته')}`); render();
  },
  async gateway() {
    const url = getCfg().gov_url; if (!url) return UI.toast(X('Set the government sync API URL in Settings first.', 'حدد رابط واجهة المزامنة الحكومية في الإعدادات أولاً.'), 'warn');
    const from = $('#gov-from')?.value || today(), to = $('#gov-to')?.value || today();
    const plates = Store.all('vehicles').filter(v => v.status !== 'sold').map(v => `${v.plate_code}${v.plate_number}`).join(',');
    try {
      UI.toast(X('Contacting gateway…', 'جارٍ الاتصال بالبوابة…'), 'info');
      const headers = { 'Content-Type': 'application/json' };
      if (Cloud.client) { const { data } = await Cloud.client.auth.getSession(); if (data?.session) headers.Authorization = 'Bearer ' + data.session.access_token; }
      const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify({ plates: plates.split(','), from, to, source: 'all' }) });
      const js = await res.json(); if (!res.ok) throw new Error(js.error || res.statusText);
      UI.toast(`${js.mode === 'mock' ? X('MOCK data', 'بيانات تجريبية') : X('Live data', 'بيانات حية')}: ${js.records.length}`, js.mode === 'mock' ? 'warn' : 'ok');
      RECON.preview(js.records.map(r => Object.assign({ _bad: !r.occurred_at || !r.plate_number }, r)));
    } catch (e) { console.error(e); UI.toast(X('Gateway error', 'خطأ في البوابة') + ': ' + e.message, 'err'); }
  },
  setStatus(id, st) {
    const b = Store.get('breaches', id); if (!b) return;
    b.billing_status = st; if (st === 'assigned_customer' && !num(b.admin_fee)) b.admin_fee = RECON.adminFee(b); if (st === 'company_usage') { b.admin_fee = 0; }
    Store.upsert('breaches', b);
    if (st === 'paid' && !b.paid_voucher_id) {
      // Salik is pre-paid by the company (expense 5600, recovered via 4200); fines recharged to customers clear 2500, others are company cost 5700
      const dr = b.breach_type === 'salik' ? acc('5600') : (b.contract_id ? acc('2500') : acc('5700'));
      try { const v = postVoucher({ type: 'PV', date: today(), narration: `${b.breach_type === 'salik' ? 'Salik' : 'Fine'} paid ${b.reference_no} ${b.plate_code} ${b.plate_number}`, reference: b.reference_no, source: 'breach:' + b.id, lines: [{ account_id: dr, debit: b.amount }, { account_id: acc('1120'), credit: b.amount }] }); b.paid_voucher_id = v?.id || ''; Store.upsert('breaches', b); } catch (e) { UI.toast(e.message, 'err'); }
    }
    render();
  },
  assign(id) {
    const b = Store.get('breaches', id); if (!b) return;
    const opts = Store.all('contracts').filter(c => c.status !== 'cancelled' && (!b.vehicle_id || c.vehicle_id === b.vehicle_id));
    UI.modal(X('Assign to contract', 'إسناد إلى عقد'), `<form id="as-form" class="space-y-3"><div class="text-sm">${esc(b.reference_no)} · ${esc(b.plate_code)} ${esc(b.plate_number)} · ${fmtDT(b.occurred_at)} · ${money(b.amount)}</div>
      <select name="c" class="inp" required><option value=""></option>${opts.map(c => `<option value="${c.id}">${esc(labelOf('contracts', c))} · ${fmtDT(c.start_at)} → ${fmtDT(c.actual_return_at || c.end_at)}</option>`).join('')}</select>
      <div class="flex justify-end gap-2"><button type="button" class="btn btn-light" onclick="UI.close()">${X('Cancel', 'إلغاء')}</button><button class="btn btn-primary">${X('Assign', 'إسناد')}</button></div></form>`, {
      onOpen: () => { $('#as-form').onsubmit = e => { e.preventDefault(); const c = Store.get('contracts', e.target.elements.c.value); if (!c) return; Object.assign(b, { contract_id: c.id, customer_id: c.customer_id, vehicle_id: c.vehicle_id, billing_status: 'assigned_customer', admin_fee: RECON.adminFee(b) }); Store.upsert('breaches', b); UI.close(); render();
        if (c.status === 'closed') UI.toast(X('Contract is already closed — issue a separate invoice for this charge from Invoices.', 'العقد مغلق — أصدر فاتورة منفصلة لهذه الرسوم.'), 'warn'); }; }
    });
  },
  invoiceClosed(id) {
    const b = Store.get('breaches', id); if (!b || !b.customer_id) return;
    const lines = [{ desc: `${b.breach_type === 'salik' ? 'Salik' : X('Traffic fine', 'مخالفة مرورية')} ${b.reference_no || ''} ${plateOf(b)} ${fmtDT(b.occurred_at)}`, qty: 1, price: num(b.amount), vat: false }];
    if (num(b.admin_fee)) lines.push({ desc: X('Admin fee', 'رسوم إدارية'), qty: 1, price: num(b.admin_fee), vat: true });
    const t = DOC.totals(lines);
    const inv = Store.upsert('invoices', { invoice_no: nextNo('invoices', 'invoice_no', 'INV'), invoice_type: 'breach', date: today(), customer_id: b.customer_id, contract_id: b.contract_id, lines, subtotal: t.subtotal, vat: t.vat, total: t.total, paid: 0, status: 'unpaid' });
    const v = postVoucher({ type: 'JV', date: today(), narration: `Fine/Salik recharge ${inv.invoice_no}`, reference: inv.invoice_no, source: 'invoice:' + inv.id, lines: [{ account_id: acc('1200'), debit: t.total }, { account_id: b.breach_type === 'salik' ? acc('4200') : acc('2500'), credit: num(b.amount) }, { account_id: acc('4300'), credit: num(b.admin_fee) }, { account_id: acc('2200'), credit: t.vat }] });
    inv.voucher_id = v?.id || ''; Store.upsert('invoices', inv);
    b.billing_status = 'invoiced'; b.invoice_id = inv.id; Store.upsert('breaches', b); render(); UI.toast(X('Invoice issued', 'تم إصدار الفاتورة') + ' ' + inv.invoice_no);
  },
  sample(kind) {
    const vs = Store.all('vehicles'), d = today(), pick = i => vs[i % vs.length];
    const [y, m, dd] = d.split('-'), dmy = `${dd}/${m}/${y}`;
    if (kind === 'salik') downloadFile('salik_sample.csv', 'Transaction ID,Trip Date,Trip Time,Toll Gate,Direction,Plate Number,Plate Source,Amount (AED)\n' + [0, 1, 2, 3, 4].map(i => `SLK${Date.now() % 1e6 + i},${dmy},${String(8 + i).padStart(2, '0')}:1${i}:00,${['Al Garhoud Bridge', 'Al Maktoum Bridge', 'Al Barsha', 'Jebel Ali', 'Business Bay Crossing'][i]},${i % 2 ? 'Northbound' : 'Southbound'},${pick(i).plate_code} ${pick(i).plate_number},Dubai,${i % 2 ? 6 : 4}`).join('\n'), 'text/csv');
    else downloadFile('dubai_police_sample.csv', 'Ticket No,Ticket Date,Ticket Time,Plate No,Plate Code,Plate Source,Fine Amount,Black Points,Location,Violation Description\n' + [5, 6, 7].map((i, k) => `DP${Date.now() % 1e7 + k},${dmy},${String(10 + k * 3).padStart(2, '0')}:4${k}:00,${pick(i).plate_number},${pick(i).plate_code},Dubai,${[600, 400, 1000][k]},${[0, 4, 6][k]},"${['Sheikh Zayed Road', 'Al Khail Road', 'Emirates Road'][k]}","${['Exceeding speed limit by 20 km/h', 'Not leaving safe distance', 'Exceeding speed limit by more than 50 km/h'][k]}"`).join('\n'), 'text/csv');
  }
};
V.breaches = () => {
  const f = state.filters.bst || 'open', tf = state.filters.btp || 'all';
  const all = Store.all('breaches');
  let rows = all.filter(b => f === 'all' || (f === 'open' ? ['unassigned', 'unmatched_plate', 'assigned_customer', 'company_usage', 'disputed'].includes(b.billing_status) : b.billing_status === f)).filter(b => tf === 'all' || b.breach_type === tf).filter(b => matchQ(b, state.q))
    .sort((a, b) => String(b.occurred_at).localeCompare(String(a.occurred_at)));
  const cnt = s => all.filter(b => b.billing_status === s).length;

  client: null, on: false, user: null, role: null, profileName: '', channel: null, timer: null,
  pending() { try { return JSON.parse(localStorage.getItem(LS_Q) || '[]').length; } catch (e) { return 0; } },
  toRow(c, rec) {
    const m = SYNC_MAP[c];
    if (!m) return { id: rec.id, collection: c, data: rec, updated_at: rec.updated_at || new Date().toISOString() };
    const row = {}, meta = {};
    Object.entries(rec).forEach(([k, v]) => { if (m.cols.includes(k)) row[k] = (v === '' || v === undefined) ? null : v; else meta[k] = v; });
    UUID_COLS.forEach(k => { if (k in row && row[k] && !/^[0-9a-f-]{36}$/i.test(row[k])) { meta[k] = row[k]; row[k] = null; } });
    row.meta = meta; return row;
  },
  fromRow(c, row) {
    if (!SYNC_MAP[c]) return row.data;
    const { meta, ...rest } = row; const rec = Object.assign({}, meta || {}, rest);
    Object.keys(rec).forEach(k => { if (rec[k] === null) rec[k] = ''; });
    ['year', 'daily_rate', 'weekly_rate', 'monthly_rate', 'odometer', 'purchase_price', 'basic_salary', 'allowances', 'rate', 'days', 'km_out', 'km_in', 'deposit', 'discount', 'extra_charges', 'vat_rate', 'subtotal', 'vat', 'total', 'paid', 'amount', 'admin_fee', 'black_points'].forEach(k => { if (rec[k] !== '' && rec[k] !== undefined) rec[k] = Number(rec[k]); });
    return rec;
  },
  queue(op) { const q = JSON.parse(localStorage.getItem(LS_Q) || '[]'); const i = q.findIndex(x => x.c === op.c && x.id === op.id); if (i >= 0) q.splice(i, 1); q.push(op); localStorage.setItem(LS_Q, JSON.stringify(q)); },
  async push(c, rec) {
    if (LOCAL_ONLY.includes(c) || !getCfg().cloud) return;
    if (!this.on) return this.queue({ op: 'up', c, id: rec.id });
    try { const t = SYNC_MAP[c]?.t || 'erp_records'; const { error } = await this.client.from(t).upsert(this.toRow(c, rec)); if (error) throw error; }
    catch (e) { console.warn('push failed', c, e); if (!this.permanent(e)) this.queue({ op: 'up', c, id: rec.id }); this.err(e); }
    renderTopbarSafe();
  },
  async del(c, id) {
    if (LOCAL_ONLY.includes(c) || !getCfg().cloud) return;
    if (!this.on) return this.queue({ op: 'del', c, id });
    try { const t = SYNC_MAP[c]?.t || 'erp_records'; const { error } = await this.client.from(t).delete().eq('id', id); if (error) throw error; }
    catch (e) { console.warn('delete failed', e); if (!this.permanent(e)) this.queue({ op: 'del', c, id }); this.err(e); }
  },
  // constraint / permission / schema errors will never succeed on retry — report instead of re-queuing
  permanent(e) { return !!(e && e.code && /^(23|42|22|P0)/.test(String(e.code))); },
  err: debounce(e => UI.toast(X('Cloud sync error — changes kept locally and will retry', 'خطأ في المزامنة — حُفظت التغييرات محلياً وستتم إعادة المحاولة') + ': ' + (e.message || e), 'warn'), 1500),
  async flush() {
    if (!this.on) return; const q = JSON.parse(localStorage.getItem(LS_Q) || '[]'); if (!q.length) return;
    localStorage.setItem(LS_Q, '[]');
    // upserts in dependency order so foreign keys resolve
    const order = ['staff', 'vehicles', 'customers', 'contracts', 'vouchers', 'breaches'];
    q.sort((a, b) => (order.indexOf(a.c) + 99) % 99 - (order.indexOf(b.c) + 99) % 99);
    for (const op of q) { if (op.op === 'del') await this.del(op.c, op.id); else { const r = Store.get(op.c, op.id); if (r) await this.push(op.c, r); } }
    renderTopbarSafe();
  },
  async init() {
    const cfg = getCfg(); if (!cfg.cloud || !cfg.url || !cfg.key) return;
    try {
      await loadScript(SUPABASE_CDN);
      if (!this.client) this.client = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true }, realtime: { params: { eventsPerSecond: 20 } } });
      const { data } = await this.client.auth.getSession();
      if (!data.session) return this.showLogin();
      this.user = data.session.user; await this.start();
    } catch (e) { console.error(e); UI.toast(X('Could not connect to Supabase', 'تعذر الاتصال بـ Supabase') + ': ' + e.message, 'err'); }
  },
  showLogin() {
    UI.modal(X('Sign in to Anamira cloud', 'تسجيل الدخول إلى سحابة أناميرا'), `<form id="login-form" class="space-y-3"><div><label class="lbl">${X('Email', 'البريد الإلكتروني')}</label><input name="email" type="email" class="inp" required autocomplete="username"></div>
      <div><label class="lbl">${X('Password', 'كلمة المرور')}</label><input name="password" type="password" class="inp" required autocomplete="current-password"></div>
      <div class="flex justify-between items-center"><button type="button" class="text-sm text-slate-500 underline" onclick="Cloud.stop().then(()=>{const c=getCfg();c.cloud=false;localStorage.setItem('${LS_CFG}',JSON.stringify(c));UI.close();render();})">${X('Work offline (local)', 'العمل محلياً')}</button><button class="btn btn-primary">${X('Sign in', 'دخول')}</button></div>
      <p class="text-xs text-slate-500">${X('Accounts are created by the administrator in Supabase → Authentication → Users.', 'يتم إنشاء الحسابات من قبل المسؤول في Supabase.')}</p></form>`, {
      onOpen: () => { $('#login-form').onsubmit = async e => { e.preventDefault(); const fe = e.target.elements; const { data, error } = await this.client.auth.signInWithPassword({ email: fe.email.value.trim(), password: fe.password.value }); if (error) return UI.toast(error.message, 'err'); this.user = data.user; UI.close(); await this.start(); }; }
    });
  },
  async start() {
    const { data: prof } = await this.client.from('profiles').select('role, full_name, staff_id, active').eq('id', this.user.id).maybeSingle();
    if (!prof || prof.active === false) { UI.toast(X('Your account has no active profile. Ask the administrator to activate it.', 'حسابك غير مفعل. اطلب من المسؤول تفعيله.'), 'err'); }
    this.role = prof?.role || 'agent'; this.profileName = prof?.full_name || this.user.email;
    if (prof?.staff_id) state.user = prof.staff_id;
    this.on = true;
    const { count } = await this.client.from('erp_records').select('id', { count: 'exact', head: true });
    if (!count && ['admin', 'manager'].includes(this.role)) { UI.toast(X('First connection: uploading local master data to the cloud…', 'أول اتصال: رفع البيانات المحلية إلى السحابة…'), 'info'); await this.uploadAll(true); }
    await this.flush(); await this.pullAll(); this.subscribe();
    clearInterval(this.timer); this.timer = setInterval(() => this.flush(), 30000);
    render(); UI.toast(X('Connected to cloud — live sync on', 'متصل بالسحابة — المزامنة المباشرة تعمل'));
  },
  async stop() { this.on = false; clearInterval(this.timer); if (this.channel && this.client) { try { await this.client.removeChannel(this.channel); } catch (e) { /* */ } } this.channel = null; this.role = null; },
  async signOut() { if (this.client) await this.client.auth.signOut(); await this.stop(); const c = getCfg(); localStorage.setItem(LS_CFG, JSON.stringify(c)); render(); this.showLogin(); },
  async fetchAll(table) { const out = []; for (let from = 0; ; from += 1000) { const { data, error } = await this.client.from(table).select('*').range(from, from + 999); if (error) throw error; out.push(...data); if (data.length < 1000) break; } return out; },
  async pullAll() {
    try {
      for (const [c, m] of Object.entries(SYNC_MAP)) db[c] = (await this.fetchAll(m.t)).map(r => this.fromRow(c, r));
      const recs = await this.fetchAll('erp_records');
      const grouped = {}; recs.forEach(r => { if (r.collection === '__settings') return; (grouped[r.collection] = grouped[r.collection] || []).push(r.data); });
      COLLECTIONS.filter(c => !SYNC_MAP[c] && !LOCAL_ONLY.includes(c)).forEach(c => db[c] = grouped[c] || []);
      const st = recs.find(r => r.collection === '__settings'); if (st) db.settings = Object.assign({}, db.settings, st.data);
      persist();
    } catch (e) { console.error(e); UI.toast(X('Pull failed', 'فشل السحب') + ': ' + e.message, 'err'); }
  },
  async pushSettings() { try { await this.client.from('erp_records').upsert({ id: '00000000-0000-4000-8000-0000000000aa', collection: '__settings', data: db.settings, updated_at: new Date().toISOString() }); } catch (e) { this.err(e); } },
  async uploadAll(silent) {
    const order = ['staff', 'vehicles', 'customers', 'contracts', 'vouchers', 'breaches'];
    try {
      for (const c of order) { const rows = Store.all(c).map(r => this.toRow(c, r)); for (let i = 0; i < rows.length; i += 500) { const { error } = await this.client.from(SYNC_MAP[c].t).upsert(rows.slice(i, i + 500)); if (error) throw error; } }
      const other = []; COLLECTIONS.filter(c => !SYNC_MAP[c] && !LOCAL_ONLY.includes(c)).forEach(c => Store.all(c).forEach(r => other.push(this.toRow(c, r))));
      for (let i = 0; i < other.length; i += 500) { const { error } = await this.client.from('erp_records').upsert(other.slice(i, i + 500)); if (error) throw error; }
      await this.pushSettings();
      if (!silent) UI.toast(X('All local data uploaded', 'تم رفع كل البيانات'));
    } catch (e) { console.error(e); UI.toast(X('Upload failed', 'فشل الرفع') + ': ' + e.message, 'err'); }
  },
  subscribe() {
    if (this.channel) this.client.removeChannel(this.channel);
    this.channel = this.client.channel('anamira-live')
      .on('postgres_changes', { event: '*', schema: 'public' }, (p) => {
        if (p.table === 'profiles') return;
        const isRec = p.table === 'erp_records';
        if (p.eventType === 'DELETE') {
          const id = p.old && p.old.id; if (!id) return;
          if (isRec) { COLLECTIONS.forEach(c => { if (!SYNC_MAP[c] && Store.get(c, id)) Store.remove(c, id, { remote: true }); }); }
          else { const c = TABLE_TO_COL[p.table]; if (c) Store.remove(c, id, { remote: true }); }
        } else {
          const n = p.new;
          if (isRec) { if (n.collection === '__settings') db.settings = Object.assign({}, db.settings, n.data); else if (COLLECTIONS.includes(n.collection)) Store.upsert(n.collection, n.data, { remote: true }); }
          else { const c = TABLE_TO_COL[p.table]; if (c) { const rec = this.fromRow(c, n); const i = db[c].findIndex(r => r.id === rec.id); if (i >= 0) db[c][i] = rec; else db[c].push(rec); } }
        }
        persist(); rerender();
      })
      .subscribe(st => { if (st === 'SUBSCRIBED') renderTopbarSafe(); });
  }
};

  voucher(id) { const v = Store.get('vouchers', id); if (!v) return; P.go(`${P.head({ JV: 'Journal Voucher', RV: 'Receipt Voucher', PV: 'Payment Voucher' }[v.voucher_type] || 'Voucher', { JV: 'قيد يومية', RV: 'سند قبض', PV: 'سند صرف' }[v.voucher_type] || 'قيد', v.voucher_no)}
    <table><tr><th>Date</th><td>${esc(v.voucher_date)}</td><th>Reference</th><td>${esc(v.reference)}</td></tr><tr><th>Narration</th><td colspan="3">${esc(v.narration)}</td></tr></table>
    <table><thead><tr><th>Account · الحساب</th><th>Memo</th><th>Debit · مدين</th><th>Credit · دائن</th></tr></thead><tbody>${v.lines.map(l => `<tr><td>${esc(refLabel('accounts', l.account_id))}</td><td>${esc(l.memo)}</td><td>${l.debit ? fmtN(l.debit) : ''}</td><td>${l.credit ? fmtN(l.credit) : ''}</td></tr>`).join('')}<tr class="tot"><td colspan="2">Total</td><td>${fmtN(v.total)}</td><td>${fmtN(v.total)}</td></tr></tbody></table><div class="sig"><div>Prepared by</div><div>Approved by</div></div>`); },
  statement(cid) { const cu = Store.get('customers', cid); const body = $('#main table'); P.go(`${P.head('Statement of Account', 'كشف حساب', today())}<p><b>${esc(cu.name)}</b> ${esc(cu.name_ar || '')} · ${esc(cu.phone)}</p>${body ? body.outerHTML : ''}`); },
  payroll(month) { const ls = HR.build(month); P.go(`${P.head('Payroll Sheet', 'مسير الرواتب', month)}<table><thead><tr><th>Employee</th><th>Basic</th><th>Allowances</th><th>Deductions</th><th>Net</th><th>Signature</th></tr></thead><tbody>${ls.map(l => `<tr><td>${esc(l.name)}</td><td>${fmtN(l.basic)}</td><td>${fmtN(l.allowances)}</td><td>${fmtN(l.deductions)}</td><td>${fmtN(l.net)}</td><td></td></tr>`).join('')}<tr class="tot"><td>Total</td><td>${fmtN(sum(ls, l => l.basic))}</td><td>${fmtN(sum(ls, l => l.allowances))}</td><td>${fmtN(sum(ls, l => l.deductions))}</td><td>${fmtN(sum(ls, l => l.net))}</td><td></td></tr></tbody></table>`); },
  report() { const b = $('#report-body'); P.go(`${P.head('Financial Report', 'تقرير مالي', today())}${b ? b.innerHTML.replace(/<select[\s\S]*?<\/select>/g, '') : ''}`); },
  table(mid) { const m = modById(mid), t = $('#main table'); if (!t) return; const c = t.cloneNode(true); $$('tr', c).forEach(tr => { const last = tr.lastElementChild; if (last) last.remove(); }); P.go(`${P.head(L(m.l), m.l[1], today())}${c.outerHTML}`); }
};

/* ---------------- Keyboard shortcuts & boot ---------------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal-bg')) UI.close();
  if (e.altKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); if (canGroup('rental')) R.open(); }
  if (e.altKey && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); App.toggleLang(); }
  if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { const q = $('#crud-q'); if (q) { e.preventDefault(); q.focus(); } }
});
window.addEventListener('storage', e => { if (e.key === LS_DB && !Cloud.on) { loadDB(); rerender(); } });
function boot() {
  loadDB();
  const h = (location.hash || '').slice(1); if (h && modById(h)) state.view = h;
  if (!Store.get('staff', state.user)) state.user = (db.staff.find(s => s.role === 'admin') || db.staff[0] || {}).id;
  render();
  if (getCfg().cloud) Cloud.init();
}
boot();
</script>
</body>
